name: iOS Expo check

on:
  push:
    branches:
      - main
      - ios-testflight-prep
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-expo-check.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-expo-check.yml'
  workflow_dispatch:

jobs:
  ios-expo-check:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --no-install --clean
