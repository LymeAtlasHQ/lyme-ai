<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">LymeWire logo</title>
  <desc id="desc">A minimal lime and mint LW signal mark on a dark rounded-square background.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="900" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151C25"/>
      <stop offset="0.58" stop-color="#081018"/>
      <stop offset="1" stop-color="#05090D"/>
    </linearGradient>
    <linearGradient id="wire" x1="128" y1="632" x2="880" y2="368" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CFFF19"/>
      <stop offset="0.34" stop-color="#7AF230"/>
      <stop offset="0.7" stop-color="#A7FF22"/>
      <stop offset="1" stop-color="#43F0C2"/>
    </linearGradient>
    <linearGradient id="shadowWire" x1="210" y1="760" x2="820" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46D730" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#13C88E" stop-opacity="0.74"/>
    </linearGradient>
    <filter id="softGlow" x="-16%" y="-16%" width="132%" height="132%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#39E85E" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="218" fill="url(#bg)"/>
  <rect x="52" y="52" width="920" height="920" rx="196" fill="none" stroke="#24303A" stroke-opacity="0.35" stroke-width="2"/>

  <path d="M210 646H336C408 646 438 612 472 558C509 500 569 502 604 560L650 638C674 678 725 678 750 638L822 524" fill="none" stroke="url(#shadowWire)" stroke-width="92" stroke-linecap="round" stroke-linejoin="round" opacity="0.72"/>

  <path d="M210 316V646H334C407 646 438 612 472 558C509 500 569 502 604 560L650 638C674 678 725 678 750 638L828 512V374" fill="none" stroke="url(#wire)" stroke-width="88" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

  <circle cx="178" cy="646" r="58" fill="#CFFF19"/>
  <circle cx="178" cy="646" r="58" fill="url(#wire)" opacity="0.92"/>
  <circle cx="828" cy="374" r="58" fill="#43F0C2"/>

  <path d="M408 646C448 637 470 604 496 562C525 516 566 516 594 562L628 620" fill="none" stroke="#45D949" stroke-width="42" stroke-linecap="round" opacity="0.5"/>
  <path d="M655 637C681 665 724 659 750 621L794 552" fill="none" stroke="#1CCF8F" stroke-width="42" stroke-linecap="round" opacity="0.48"/>
</svg>
